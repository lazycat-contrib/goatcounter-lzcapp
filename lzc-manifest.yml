application:
  subdomain: goatcounter
  multi_instance: false
  # GoatCounter has its own accounts, so it is exposed directly rather than
  # behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://goatcounter:8080/

services:
  goatcounter:
    # upstream: arp242/goatcounter:2.7.0
    image: docker.1ms.run/arp242/goatcounter:2.7.0
    environment:
      # Only variables confirmed in the source are set. The image already
      # listens on 8080 and offers a setup wizard there, so no listen/domain
      # override is needed (an unverified GOATCOUNTER_DOMAIN would simply be
      # ignored, which is exactly the trap we want to avoid).
      - TZ=Asia/Shanghai
    binds:
      # SQLite database (and ACME certs when used) live here; upstream's README
      # calls this volume out as the thing to keep.
      - /lzcapp/var/goatcounter-data:/home/goatcounter/goatcounter-data

usage: |
  GoatCounter 是注重隐私的网站统计工具。它不用 Cookie，不记录个人信息，只看页面访问量、来源和浏览器分布这类聚合数据，所以不需要在网站上放那些同意弹窗。适合个人博客、小站点，或者不想把访问数据交给第三方分析的场景。

  使用方法：
  1. 打开应用，第一次会进入**设置向导**，填站点信息和管理员账号——**账号由你自己设置**。
     （官方文档写的是「用 http://localhost:8080 上的向导或 CLI 创建第一个站点」，
     本包已直接对外开放，所以你打开首页看到的就是那个向导。）
  2. 建好站点后会得到一段统计脚本，把它贴进你的网站页面里。
  3. 之后打开后台就能看到访问量、来源、页面排行等数据。
  4. 也可以在后台加多个站点，分别统计。

  数据与安全：
  - SQLite 数据库存在 /lzcapp/var/goatcounter-data，卸载会一并删除，请定期备份。
  - **没有内置默认口令**：管理员账号在设置向导里由你自己填。
  - 应用直接对外开放，由 GoatCounter 自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。
    （统计采集接口本来就需要外部访问，这也是必须放开的原因之一。）

  说明：
  - 单容器 + 内置 SQLite，不需要额外数据库。
  - 未配置邮件，账号验证与找回密码需要你先配置邮件服务。
  - 未启用 HTTPS 自动证书（ACME）：容器前面有入口网关负责 TLS，不需要容器自己申请证书。
  - 界面为英文，部分内容有中文翻译。
  - 未做真机验证：设置向导、创建站点、采集统计以及重启后数据留存
    均未在设备上实测。
